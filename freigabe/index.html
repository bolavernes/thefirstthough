<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Freigabe — the first thought</title>
<meta name="theme-color" content="#141414">
<link rel="icon" href="../assets/img/logo-pink.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  body{min-height:100vh;min-height:100dvh}
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px var(--gutter);border-bottom:1px solid var(--line)}
  .top span{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .wrap{max-width:560px}
  .lockscreen{min-height:calc(100dvh - 70px);display:grid;place-items:center;text-align:center;padding:24px var(--gutter)}
  .lockscreen h1{font-weight:900;font-size:30px;line-height:1.1;margin:14px 0 6px}
  .lockscreen p{color:var(--mist);margin:0 0 24px}
  .dots{display:flex;justify-content:center;gap:14px;margin:0 0 24px}
  .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mist)}
  .dots i.on{background:var(--pink);border-color:var(--pink)}
  .dots.err{animation:sh .35s}
  @keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
  .pad button{height:76px;border-radius:50%;border:1.5px solid var(--line);background:var(--ink-2);color:var(--paper);font:600 28px var(--sans);cursor:pointer}
  .pad button:active{background:var(--pink);color:var(--ink)}
  .pad button.ghost{border:0;background:transparent;font-size:15px;color:var(--muted)}
  .msg{min-height:22px;color:var(--pink);font-size:14px;margin-top:16px}

  .review{padding:22px var(--gutter) 140px}
  .review h1{font-weight:900;font-size:28px;line-height:1.1;margin:6px 0 4px}
  .review .sub{color:var(--mist);margin:0 0 20px}
  .card{background:var(--ink-2);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:18px}
  .card .meta{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:13.5px;color:var(--mist)}
  .card .meta b{color:var(--paper)}
  .card .pv{background:#000}
  .card .pv.story{max-width:300px;margin:0 auto}
  .card .cap{padding:12px 16px;font-size:14.5px;color:var(--mist);border-top:1px solid var(--line);white-space:pre-wrap}
  .card .act{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 16px}
  .card .act button{font:700 15px var(--sans);padding:14px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--paper);cursor:pointer}
  .card .act button.ok[aria-pressed="true"]{background:#3ccf7a;border-color:#3ccf7a;color:var(--ink)}
  .card .act button.ch[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--ink)}
  .card textarea{display:none;width:calc(100% - 32px);margin:0 16px 16px;font:16px var(--sans);background:var(--ink);color:var(--paper);border:1.5px solid var(--pink);border-radius:12px;padding:12px;min-height:80px}
  .card.change textarea{display:block}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,20,20,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom))}
  .bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
  .bar span{font-size:14px;color:var(--mist)}
  .bar .btn{padding:15px 20px;font-size:15px;white-space:nowrap}
  .bar .btn[disabled]{opacity:.4;pointer-events:none}
  .done{text-align:center;padding:60px var(--gutter)}
  .done h1{font-family:var(--display);font-weight:400;color:var(--pink);font-size:72px;line-height:.9;margin:20px 0}
  .done p{color:var(--mist)}
  .demo{font-size:12px;color:var(--muted);margin-top:24px}
</style>
</head>
<body>
<div class="top"><img class="logo" src="../assets/img/logo-white.svg" alt="the first thought" style="width:32px"><span>Freigabe</span></div>
<div id="app"></div>

<script src="../assets/js/templates.js"></script>
<script>
(() => {
"use strict";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let D = null;
try { const m = location.hash.match(/d=([^&]+)/); if (m) D = TFT_unpack(m[1]); } catch (e) {}
if (!D) { app.innerHTML = `<div class="lockscreen"><div><h1>Link ungültig</h1><p>Bitte frag bei the first thought einen neuen Freigabe-Link an.</p></div></div>`; return; }
if (D.x && Date.now() > D.x) { app.innerHTML = `<div class="lockscreen"><div><h1>Link abgelaufen</h1><p>Dieser Freigabe-Link war 7 Tage gültig. Bitte frag einen neuen an.</p></div></div>`; return; }
TFT_loadFonts(D.b);
(D.p || []).forEach(p => { if (p.layout) TFT_useLayout(p.tpl, p.layout); });

// ---------- PIN ----------
let pin = "", tries = 0, lockedUntil = 0;
function lock() {
  app.innerHTML = `<div class="lockscreen"><div>
    <img src="../assets/img/logo-pink.svg" alt="" style="width:56px;margin:0 auto">
    <h1>Neue Posts für<br>${esc(D.b.name)}</h1>
    <p>${D.p.length} Posts warten auf deine Freigabe. Gib die PIN ein, die du von uns bekommen hast.</p>
    <div class="dots" id="dots">${"<i></i>".repeat(4)}</div>
    <div class="pad" id="pad"></div>
    <div class="msg" id="msg"></div>
  </div></div>`;
  const pad = document.getElementById("pad");
  ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = k;
    if (k === "") { b.className = "ghost"; b.disabled = true; }
    if (k === "⌫") b.className = "ghost";
    b.onclick = () => press(k);
    pad.appendChild(b);
  });
}
async function press(k) {
  const msg = document.getElementById("msg");
  if (Date.now() < lockedUntil) { msg.textContent = `Zu viele Versuche. Bitte ${Math.ceil((lockedUntil - Date.now()) / 1000)} s warten.`; return; }
  if (k === "⌫") pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
  [...document.querySelectorAll("#dots i")].forEach((i, ix) => i.classList.toggle("on", ix < pin.length));
  if (pin.length === 4) {
    const ok = (await TFT_hash(D.s + pin)) === D.h;
    if (ok) { review(); return; }
    tries++; pin = "";
    const dots = document.getElementById("dots"); dots.classList.remove("err"); void dots.offsetWidth; dots.classList.add("err");
    [...dots.children].forEach(i => i.classList.remove("on"));
    if (tries >= 3) { lockedUntil = Date.now() + 60000; tries = 0; msg.textContent = "Gesperrt für 60 Sekunden."; }
    else msg.textContent = "PIN stimmt nicht.";
  }
}

// ---------- Review ----------
const R = {};
function review() {
  const fmt = iso => new Date(iso + "T12:00").toLocaleDateString("de-AT", { weekday: "long", day: "numeric", month: "long" });
  app.innerHTML = `<div class="review wrap">
    <span class="tag">${esc(D.b.name)}</span>
    <h1>${D.p.length} Posts zur Freigabe</h1>
    <p class="sub">Passt's? Dann „Passt“. Sonst „Ändern“ und kurz dazuschreiben, was anders sein soll.</p>
    <div id="cards"></div>
  </div>
  <div class="bar"><div class="in"><span id="cnt"></span><button class="btn btn--pink" id="go" disabled>Absenden</button></div></div>`;
  const cards = document.getElementById("cards");
  D.p.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(p => {
    const t = TFT_tpl(p);
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<div class="meta"><b>${esc(fmt(p.date))}</b><span>${esc(t.format)}</span></div><div class="pv ${t.h > t.w * 1.5 ? "story" : ""}"></div>${p.caption ? `<div class="cap">${esc(p.caption)}</div>` : ""}<div class="act"><button class="ok" type="button">✓ Passt</button><button class="ch" type="button">✎ Ändern</button></div><textarea placeholder="Was soll anders sein?"></textarea>`;
    const [ok, ch] = c.querySelectorAll(".act button"); const ta = c.querySelector("textarea");
    const set = s => { R[p.id] = { s, c: s === "change" ? ta.value : "" }; c.classList.toggle("change", s === "change"); ok.setAttribute("aria-pressed", String(s === "ok")); ch.setAttribute("aria-pressed", String(s === "change")); upd(); if (s === "change") ta.focus(); };
    ok.onclick = () => set("ok"); ch.onclick = () => set("change");
    ta.oninput = () => { if (R[p.id]) R[p.id].c = ta.value; upd(); };
    cards.appendChild(c);
    requestAnimationFrame(() => TFT_mount(c.querySelector(".pv"), p, D.b, { controls: true }));
  });
  upd();
  document.getElementById("go").onclick = finish;
}
function upd() {
  const n = Object.keys(R).length, all = D.p.length;
  const missing = Object.values(R).some(r => r.s === "change" && !r.c.trim());
  document.getElementById("cnt").textContent = `${n} von ${all} beantwortet`;
  document.getElementById("go").disabled = n < all || missing;
}
function finish() {
  const r = D.p.map(p => ({ id: p.id, s: R[p.id].s, c: R[p.id].c }));
  const ok = r.filter(x => x.s === "ok").length, ch = r.length - ok;
  const back = new URL("../content/", location.href).href + "#fb=" + TFT_pack({ r });
  const text = `Freigabe ${D.b.name}: ${ok} passt, ${ch} ändern.` + r.filter(x => x.s === "change").map(x => `\n• ${D.p.find(p => p.id === x.id).date}: ${x.c}`).join("") + `\n\n${back}`;
  app.innerHTML = `<div class="done wrap"><img src="../assets/img/logo-pink.svg" alt="" style="width:56px;margin:0 auto"><h1>DANKE!</h1>
    <p>${ok} Posts freigegeben${ch ? `, ${ch} mit Änderungswunsch` : ""}. Wir kümmern uns darum.</p>
    <p style="margin-top:22px"><a class="btn btn--pink" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">Antwort per WhatsApp senden</a></p>
    <p class="demo">Demo: In der echten Version landet die Antwort automatisch im Cockpit.<br><a href="${esc(back)}">Antwort im Cockpit übernehmen (Agentur-Ansicht)</a></p></div>`;
}
lock();
})();
</script>
</body>
</html>
